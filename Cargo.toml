[package]
name = "raw2raf"
version = "1.0.0"
edition = "2021"
authors = ["IPWeb"]
description = "Fast RAW to Fujifilm GFX 100S II RAF converter in Rust"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
rayon = "1.10"
anyhow = "1.0"
tempfile = "3.16"
walkdir = "2.5"
byteorder = "1.5"
memmap2 = "0.9"
rawler = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

